name: Release

# Every push to main produces a new signed release:
#   1. compute the next version (auto-bump if the developer didn't)
#   2. build the APK signed with the CONSTANT release keystore
#   3. verify the signing certificate matches the expected fingerprint
#   4. commit the bumped version.properties back to main ("[skip ci]")
#   5. tag + publish a GitHub Release with commit-based notes and
#      release-MT-Player-v<version>.apk (GitHub adds the source .zip / .tar.gz automatically)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = from Conventional Commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: MT-Player

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    steps:
      - name: Checkout (full history for tags & changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: version
        env:
          BUMP_OVERRIDE: ${{ github.event.inputs.bump || 'auto' }}
        run: bash .github/scripts/compute-version.sh

      - name: Restore constant release keystore
        env:
          MT_KEYSTORE_BASE64: ${{ secrets.MT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MT_KEYSTORE_BASE64" ]; then
            echo "::error::MT_KEYSTORE_BASE64 secret is missing. Refusing to sign with a random key."
            exit 1
          fi
          echo "$MT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MT_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          MT_KEYSTORE_PASSWORD: ${{ secrets.MT_KEYSTORE_PASSWORD }}
          MT_KEY_ALIAS: ${{ secrets.MT_KEY_ALIAS }}
          MT_KEY_PASSWORD: ${{ secrets.MT_KEY_PASSWORD }}
          MT_UPDATER_TOKEN: ${{ secrets.MT_UPDATER_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache assembleRelease testDebugUnitTest

      - name: Verify signature & rename APK
        id: apk
        env:
          MT_KEYSTORE_PASSWORD: ${{ secrets.MT_KEYSTORE_PASSWORD }}
          MT_KEY_ALIAS: ${{ secrets.MT_KEY_ALIAS }}
          MT_KEY_PASSWORD: ${{ secrets.MT_KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC=$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)
          if [ -z "$SRC" ]; then echo "::error::No signed APK produced"; exit 1; fi

          if [ -n "$MT_KEYSTORE_PATH" ] && [ -f "$MT_KEYSTORE_PATH" ]; then
            echo "Signing release APK with constant release keystore..."
            "$BT/apksigner" sign --ks "$MT_KEYSTORE_PATH" \
              --ks-pass "pass:$MT_KEYSTORE_PASSWORD" \
              --ks-key-alias "$MT_KEY_ALIAS" \
              --key-pass "pass:$MT_KEY_PASSWORD" \
              "$SRC"
          fi

          ACTUAL=$("$BT/apksigner" verify --print-certs "$SRC" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          EXPECTED=$(tr -d '[:space:]' < .github/release-signing-cert.sha256)
          echo "Signing cert: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK is not signed with the constant release key (expected $EXPECTED)"
            exit 1
          fi

          NAME="release-${APP_NAME}-v${{ steps.version.outputs.version_name }}.apk"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          SHA=$(sha256sum "dist/$NAME" | awk '{print $1}')
          (cd dist && sha256sum "$NAME" > SHA256SUMS.txt)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: commit
        if: steps.version.outputs.changed == 'true'
        run: |
          git add version.properties
          git commit -m "chore(release): v${{ steps.version.outputs.version_name }} [skip ci]"
          # Best effort: if main moved meanwhile, the tag still points at this commit and the
          # next run derives the version from the tag, so versions never go backwards.
          git push origin HEAD:main || echo "::warning::Could not push version bump to main (branch moved)."

      - name: Generate release notes
        run: |
          bash .github/scripts/release-notes.sh \
            "${{ steps.version.outputs.version_name }}" \
            "${{ steps.version.outputs.version_code }}" \
            "${{ steps.version.outputs.previous_tag }}" \
            "${{ steps.apk.outputs.name }}" \
            "${{ steps.apk.outputs.sha }}" > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"

      - name: Tag & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag -a "$TAG" -m "MT Player $TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            "dist/${{ steps.apk.outputs.name }}" \
            dist/SHA256SUMS.txt \
            --title "MT Player $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            --verify-tag \
            --latest
