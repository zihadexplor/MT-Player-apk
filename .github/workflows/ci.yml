name: CI

# Fast feedback for pull requests and feature branches: debug build, unit tests and lint.
# Releases are produced only by release.yml on main.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Version scripts dry-run
        run: |
          git fetch --tags --force --unshallow 2>/dev/null || git fetch --tags --force
          cp version.properties /tmp/version.properties.bak
          bash .github/scripts/compute-version.sh
          cp /tmp/version.properties.bak version.properties

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MT-Player-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
