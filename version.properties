# Single source of truth for the app version.
#
# You MAY bump these manually. If you don't, the "Release" GitHub workflow bumps them
# automatically on every push to main (semver from Conventional Commits) and commits the
# result back with "[skip ci]".
#
#   VERSION_NAME  semantic version shown to users (MAJOR.MINOR.PATCH)
#   VERSION_CODE  monotonically increasing integer used by Android to allow upgrades
VERSION_NAME=1.0.0
VERSION_CODE=1
